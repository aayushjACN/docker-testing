apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-api-deployment
  labels:
    app: fast-api-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fast-api-deployment
  template:
    metadata:
      labels:
        app: fast-api-deployment
    spec:
      containers:
      - name: fast-api
        image: ghcr.io/aayushjACN/docker-testing:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "200m"
            memory: 300Mi
          limits:
            memory: 500Mi

